<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Мысық Репетитор</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f7f7f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 850px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 24px 40px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }

    /* Баптаулар батырмасы (API кілт енгізу үшін) */
    .settings-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #f1f1f3;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: background 0.2s;
    }
    .settings-btn:hover { background: #e4e4e7; }

    /* Мысық аватары және артқы жарығы */
    .avatar-wrapper {
      margin-top: 30px;
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .glow {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 149, 28, 0.35) 0%, rgba(255, 149, 28, 0) 70%);
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 0;
    }

    .avatar-wrapper.speaking .glow {
      transform: scale(1.25);
      opacity: 1;
    }

    .cat-svg {
      width: 175px;
      height: 175px;
      z-index: 1;
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* Көз жыпылықтату анимациясы */
    .cat-eyes {
      transform-origin: center 108px;
      animation: blink 4.5s infinite;
    }

    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }

    /* Сөйлегенде ауыз қимылы */
    .mouth-open {
      opacity: 0;
      transform-origin: 100px 132px;
      transition: opacity 0.1s;
    }
    .avatar-wrapper.speaking .mouth-open {
      opacity: 1;
      animation: talk 0.22s infinite alternate;
    }
    .avatar-wrapper.speaking .mouth-closed {
      opacity: 0;
    }

    @keyframes talk {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.15); }
    }

    /* Мәтін (Субтитр) аймағы */
    .subtitle-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 12px;
      max-height: 280px;
      overflow-y: auto;
    }

    .coach-text {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.38;
      color: #18181b;
      transition: opacity 0.2s;
    }

    .user-transcript {
      margin-top: 12px;
      font-size: 14px;
      color: #71717a;
      font-style: italic;
    }

    /* Төменгі микрофон батырмасы */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mic-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #e5482e;
      border: 6px solid #e4e4e7;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, background-color 0.2s, box-shadow 0.2s;
      touch-action: none;
    }

    .mic-btn:active, .mic-btn.recording {
      transform: scale(0.92);
      background: #ff3b1d;
      box-shadow: 0 0 0 12px rgba(229, 72, 46, 0.18);
    }

    .mic-btn:disabled {
      background: #d4a39b;
      cursor: not-allowed;
    }

    .hold-label {
      font-size: 14px;
      font-weight: 600;
      color: #71717a;
    }

    .status-label {
      font-size: 12px;
      color: #a1a1aa;
      height: 16px;
    }

    /* API кілт енгізу терезесі */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal.open { display: flex; }

    .modal-card {
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-card h3 { font-size: 18px; color: #18181b; }
    .modal-card p { font-size: 13px; color: #52525b; line-height: 1.4; }
    .modal-card input, .modal-card select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
      font-size: 14px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #ff8c1a; color: #fff; }
    .btn-secondary { background: #f4f4f5; color: #3f3f46; }
  </style>
</head>
<body>

  <div class="app-container">
    <button class="settings-btn" id="openSettings" title="Баптаулар">⚙️</button>

    <!-- Мысық аватары -->
    <div class="avatar-wrapper" id="avatarWrapper">
      <div class="glow"></div>
      <svg class="cat-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="catGrad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFA93A"/>
            <stop offset="100%" stop-color="#F26B1D"/>
          </linearGradient>
        </defs>
        <!-- Құлақтары мен басы -->
        <path d="M42 75 L34 26 C33 20 40 17 45 21 L80 48 C93 45 107 45 120 48 L155 21 C160 17 167 20 166 26 L158 75 C171 91 176 112 170 133 C162 161 134 176 100 176 C66 176 38 161 30 133 C24 112 29 91 42 75 Z" fill="url(#catGrad)"/>
        
        <!-- Қастары -->
        <rect x="58" y="76" width="18" height="6" rx="3" transform="rotate(-10 58 76)" fill="#8C3308"/>
        <rect x="124" y="73" width="18" height="6" rx="3" transform="rotate(10 124 73)" fill="#8C3308"/>

        <!-- Көздері -->
        <g class="cat-eyes">
          <circle cx="68" cy="108" r="17" fill="#3D180A"/>
          <circle cx="62" cy="102" r="5.5" fill="#FFFFFF"/>
          <circle cx="73" cy="113" r="2.2" fill="#FFFFFF" opacity="0.7"/>

          <circle cx="132" cy="108" r="17" fill="#3D180A"/>
          <circle cx="126" cy="102" r="5.5" fill="#FFFFFF"/>
          <circle cx="137" cy="113" r="2.2" fill="#FFFFFF" opacity="0.7"/>
        </g>

        <!-- Мұрны -->
        <path d="M95 121 C95 119 105 119 105 121 C105 124 101 127 100 127 C99 127 95 124 95 121 Z" fill="#3D180A"/>

        <!-- Жабық ауыз -->
        <path class="mouth-closed" d="M88 131 Q94 137 100 130 Q106 137 112 131" stroke="#3D180A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

        <!-- Ашық ауыз (сөйлегенде) -->
        <ellipse class="mouth-open" cx="100" cy="134" rx="9" ry="10" fill="#7A1C1C"/>
      </svg>
    </div>

    <!-- Мәтін аймағы -->
    <div class="subtitle-box">
      <div class="coach-text" id="coachText">Сәлем! Ағылшынша «Мен отбасым үшін тамақ әзірледім» деп қалай айтамыз?</div>
      <div class="user-transcript" id="userTranscript"></div>
    </div>

    <!-- Басқару батырмасы -->
    <div class="controls">
      <button class="mic-btn" id="micBtn"></button>
      <div class="hold-label">Сөйлеу үшін басып тұрыңыз</div>
      <div class="status-label" id="statusLabel">Дайын</div>
    </div>
  </div>

  <!-- Баптаулар терезесі -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h3>ИИ Баптаулары</h3>
      <p>Нағыз ИИ-мен сөйлесу үшін <b>Google Gemini API</b> кілтін енгізіңіз (тегін алуға болады: aistudio.google.com). Кілтсіз демо-режимде жұмыс істейді.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <select id="langSelect">
        <option value="ru-RU">Түсіндіру тілі: Орысша (видеодағыдай)</option>
        <option value="kk-KZ">Түсіндіру тілі: Қазақша</option>
      </select>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeSettings">Жабу</button>
        <button class="btn btn-primary" id="saveSettings">Сақтау</button>
      </div>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const coachText = document.getElementById('coachText');
    const userTranscript = document.getElementById('userTranscript');
    const statusLabel = document.getElementById('statusLabel');
    const avatarWrapper = document.getElementById('avatarWrapper');

    // Баптаулар
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const langSelect = document.getElementById('langSelect');

    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let tutorLang = localStorage.getItem('tutor_lang') || 'ru-RU';
    apiKeyInput.value = apiKey;
    langSelect.value = tutorLang;

    document.getElementById('openSettings').onclick = () => settingsModal.classList.add('open');
    document.getElementById('closeSettings').onclick = () => settingsModal.classList.remove('open');
    document.getElementById('saveSettings').onclick = () => {
      apiKey = apiKeyInput.value.trim();
      tutorLang = langSelect.value;
      localStorage.setItem('gemini_api_key', apiKey);
      localStorage.setItem('tutor_lang', tutorLang);
      settingsModal.classList.remove('open');
      coachText.textContent = tutorLang === 'ru-RU'
        ? 'как сказать по-английски «я приготовила для своей семьи»?'
        : 'Ағылшынша «Мен отбасым үшін тамақ әзірледім» деп қалай айтамыз?';
    };

    // Сөйлесу тарихы
    let chatHistory = [];

    // 1. Дауысты тану (Speech-to-Text)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let finalTranscript = '';

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      // Қолданушы ағылшынша да, орысша/қазақша да сөйлей алуы үшін:
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        userTranscript.textContent = `Сіз: "${(finalTranscript + interim).trim()}"`;
      };

      recognition.onerror = (e) => {
        console.error('Speech error:', e.error);
        statusLabel.textContent = 'Микрофон қатесі: ' + e.error;
      };
    } else {
      statusLabel.textContent = 'Браузер дауыс тануды қолдамайды (Chrome қолданыңыз)';
    }

    // Батырманы басып тұру оқиғалары (телефон + компьютер)
    function startRecording(e) {
      e.preventDefault();
      if (!recognition || isRecording) return;
      window.speechSynthesis.cancel(); // Егер мысық сөйлеп жатса, тоқтату
      avatarWrapper.classList.remove('speaking');

      isRecording = true;
      finalTranscript = '';
      userTranscript.textContent = '';
      micBtn.classList.add('recording');
      statusLabel.textContent = 'Тыңдап тұрмын...';
      try {
        recognition.start();
      } catch (err) {}
    }

    function stopRecording(e) {
      e.preventDefault();
      if (!recognition || !isRecording) return;
      isRecording = false;
      micBtn.classList.remove('recording');
      recognition.stop();
      statusLabel.textContent = 'Ойланып жатыр...';
      coachText.textContent = '...';

      setTimeout(() => {
        const text = finalTranscript.trim();
        if (text) {
          processUserMessage(text);
        } else {
          statusLabel.textContent = 'Дыбыс естілмеді. Қайта басып көріңіз.';
          coachText.textContent = 'Ештеңе естімедім, микрофонды басып тұрып сөйлеңіз!';
        }
      }, 500);
    }

    micBtn.addEventListener('mousedown', startRecording);
    micBtn.addEventListener('mouseup', stopRecording);
    micBtn.addEventListener('touchstart', startRecording);
    micBtn.addEventListener('touchend', stopRecording);

    // 2. ИИ-мен байланысу (Gemini API немесе Демо)
    async function processUserMessage(userText) {
      if (!apiKey) {
        // API кілт енгізілмеген жағдайдағы демо-жауап (видеодағыдай әзіл)
        let reply = '';
        if (userText.toLowerCase().includes('cooked my family') && !userText.toLowerCase().includes('for')) {
          reply = 'аа, так и знала... ты каннибал! ты приготовила свою семью! правильно будет «I cooked for my family», повтори пожалуйста';
        } else if (userText.toLowerCase().includes('cooked for my family')) {
          reply = 'отлично! теперь пожалуйста учи английский со мной вместо того чтобы готовить свою семью. как сказать «я очень устал сегодня»?';
        } else {
          reply = `хм, ты сказал «${userText}». но правильно будет «I cooked for my family» (не забудь предлог FOR, иначе ты съешь свою семью!). повтори!`;
        }
        displayAndSpeak(reply);
        return;
      }

      const systemPrompt = tutorLang === 'ru-RU'
        ? `Ты — милый, но саркастичный и остроумный кот-репетитор английского языка. Отвечай коротко (1-3 предложения), без смайликов и без markdown-звездочек (текст будет озвучиваться). Если ученик ошибся в переводе или грамматике, забавно пошути над буквальным смыслом его ошибки, исправь и попроси повторить. Если сказал верно — похвали с легким сарказмом и дай следующую фразу для перевода на английский.`
        : `Сен — сүйкімді, бірақ аздап сарказммен сөйлейтін әзілқой мысық ағылшын тілі репетиторысың. Қысқа жауап бер (1-3 сөйлем), смайликтер мен жұлдызшаларды қолданба (мәтін дауыстап оқылады). Оқушы қателессе, әзілдеп түзетіп, қайталауды сұра. Дұрыс айтса — мақтап, келесі сөйлемді бер.`;

      chatHistory.push({ role: 'user', parts: [{ text: userText }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: chatHistory
          })
        });

        const data = await response.json();
        const aiReply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Кешіріңіз, байланыс үзілді.';
        chatHistory.push({ role: 'model', parts: [{ text: aiReply }] });
        displayAndSpeak(aiReply);
      } catch (error) {
        statusLabel.textContent = 'API қатесі';
        coachText.textContent = 'API кілтті тексеріңіз немесе интернетті қосыңыз.';
      }
    }

    // 3. Мәтінді шығару және дауыстап оқу (Text-to-Speech)
    function displayAndSpeak(text) {
      coachText.textContent = text;
      statusLabel.textContent = 'Мысық сөйлеп жатыр...';

      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = tutorLang;
        utterance.pitch = 1.25; // Сәл жіңішкелеу (мысыққа ұқсас) дауыс
        utterance.rate = 1.05;

        utterance.onstart = () => avatarWrapper.classList.add('speaking');
        utterance.onend = () => {
          avatarWrapper.classList.remove('speaking');
          statusLabel.textContent = 'Дайын';
        };
        utterance.onerror = () => {
          avatarWrapper.classList.remove('speaking');
          statusLabel.textContent = 'Дайын';
        };

        window.speechSynthesis.speak(utterance);
      } else {
        statusLabel.textContent = 'Дайын';
      }
    }
  </script>
</body>
</html>
